# DSH settings example: local model tiers as llm-pi-ai providers.
# Merge the llm-pi-ai section into $DSH_HOME/settings.yaml (or .dsh-home/settings.yaml).
# This gives DSH's own agent loop direct access to the local tiers for planning,
# while contract implementation goes through the llama-mm MCP tools.
llm-pi-ai:
  providers:
    local-quality:
      displayName: Local Quality Executor
      api: openai-completions
      baseURL: http://127.0.0.1:8081/v1     # your tier=quality profile port
      apiKeyEnv: DSH_LOCAL_API_KEY          # llama-server ignores the key; set a dummy
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: quality-executor
          contextWindow: 65536
          maxTokens: 8192
    local-bulk:
      displayName: Local Bulk Executor
      api: openai-completions
      baseURL: http://127.0.0.1:8082/v1     # your tier=bulk profile port
      apiKeyEnv: DSH_LOCAL_API_KEY
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: bulk-executor
          contextWindow: 32768
          maxTokens: 4096

agent-default-model:
  provider: local-quality
  model: quality-executor
