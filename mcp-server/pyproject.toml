[project]
name = "llama-multimodel-mcp"
version = "0.1.0"
description = "MCP server exposing local llama-server / OpenAI-compatible model profiles, lifecycle, and inference debugging to coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jerry-Lee661" }]
dependencies = [
    "mcp>=1.29,<2",
    "httpx>=0.27",
    "psutil>=5.9",
    "zeroconf>=0.131,<1",
]

[project.urls]
Homepage = "https://github.com/Jerry-Lee661/llama-guild"

[project.scripts]
llama-multimodel-mcp = "llama_multimodel_mcp.server:main"
llama-decide = "llama_multimodel_mcp.decide:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
